<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Financeiro - Fluxo de Caixa Detalhado</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .filter-btn-receitas,
        .filter-btn-despesas,
        .filter-btn-ambos {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        
        .filter-btn-receitas:hover:not(.active),
        .filter-btn-despesas:hover:not(.active),
        .filter-btn-ambos:hover:not(.active) {
            background-color: var(--gray-100) !important;
            color: var(--primary-dark) !important;
        }
        
        .filter-btn-receitas.active,
        .filter-btn-despesas.active,
        .filter-btn-ambos.active {
            background-color: var(--primary-dark) !important;
            color: white !important;
            box-shadow: 0 2px 4px rgba(0, 61, 117, 0.2);
            transform: translateY(-1px);
        }
        
        .filter-btn-group {
            background-color: white;
            border: 1px solid #e5e7eb;
        }

        .receita-row {
            background-color: #f0f9ff;
            border-left: 3px solid #10b981;
        }
        
        .despesa-row {
            background-color: #fef2f2;
            border-left: 3px solid #ef4444;
        }

        .saldo-positivo {
            color: #10b981;
            font-weight: 600;
        }
        
        .saldo-negativo {
            color: #ef4444;
            font-weight: 600;
        }
        
        /* Estilos para filtros de checkbox */
        .custom-select-button {
            position: relative;
            cursor: pointer;
            user-select: none;
        }
        
        .custom-select-options {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 50;
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            max-height: 12rem;
            overflow-y: auto;
            display: none;
        }
        
        .custom-select-options.show {
            display: block;
        }
        
        .custom-select-options label {
            display: flex;
            align-items: center;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
        }
        
        .custom-select-options label:hover {
            background-color: #f3f4f6;
        }
        
        .custom-select-options input[type="checkbox"] {
            margin-right: 0.5rem;
        }

        /* Estilos para DRE - mais sutis */
        .dre-header {
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
        }
        
        .dre-subheader {
            background-color: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 600;
        }
        
        .dre-total {
            background-color: #f8fafc;
            font-weight: bold;
            border-top: 2px solid #e2e8f0;
        }
        
        .dre-categoria {
            background-color: #f9fafb;
            font-weight: 600;
            border-left: 3px solid var(--primary-color);
        }
        
        .dre-subcategoria {
            background-color: white;
            padding-left: 2rem;
            border-left: 1px solid #e5e7eb;
        }
        
        .drill-toggle {
            cursor: pointer;
            transition: transform 0.2s;
            color: var(--primary-color);
        }
        
        .drill-toggle:hover {
            transform: scale(1.1);
        }
        
        .drill-toggle.expanded {
            transform: rotate(90deg);
        }
        
        .drill-content {
            display: none;
        }
        
        .drill-content.show {
            display: table-row;
        }
        
        .valor-positivo {
            color: #10b981;
        }
        
        .valor-negativo {
            color: #ef4444;
        }
        
        .percentual {
            font-size: 0.75rem;
            color: #6b7280;
        }

        /* Estilos para hover nas linhas */
        .dre-categoria:hover,
        .dre-subcategoria:hover {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="text-gray-700 bg-gray-50">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a class="text-xl font-bold text-gray-800" href="./fluxo_caixa.html">Painel Financeiro</a>
                </div>
                <div class="flex space-x-4">
                    <a href="./fluxo_caixa.html" class="text-gray-600 hover:text-primary">Fluxo de Caixa</a>
                    <a href="./fluxo_entradas.html" class="text-gray-600 hover:text-primary">Fluxo Entradas</a>
                    <a href="./fluxo_saida.html" class="text-gray-600 hover:text-primary">Fluxo Saídas</a>
                    <a href="./fluxo_detalhado.html" class="text-primary font-semibold">Fluxo Detalhado</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-3 lg:p-4">
        <!-- Cabeçalho com Filtros -->
        <div class="bg-white rounded-xl shadow-sm border mb-4">
            <div class="p-4 border-b border-gray-100 bg-primary-light">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-2xl font-bold text-primary">Fluxo de Caixa - Detalhado</h1>
                        <p class="text-sm text-gray-600 mt-1">Análise detalhada de receitas e despesas por categoria</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <!-- Filtro de Tipo -->
                        <div class="flex bg-white rounded-lg p-1 shadow-sm border filter-btn-group">
                            <button id="filtro-receitas" class="px-3 py-2 text-xs font-medium rounded-md transition-all text-gray-600 filter-btn-receitas">
                                Receitas
                            </button>
                            <button id="filtro-despesas" class="px-3 py-2 text-xs font-medium rounded-md transition-all text-gray-600 filter-btn-despesas">
                                Despesas
                            </button>
                            <button id="filtro-ambos" class="px-3 py-2 text-xs font-medium rounded-md transition-all active filter-btn-ambos">
                                Ambos
                            </button>
                        </div>
                        <button id="clear-filters-btn" class="btn-primary hover:bg-primary-darker text-white text-sm font-medium py-2 px-3 rounded-lg transition-colors">
                            Limpar Filtros
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Filtros Compactos -->
            <div class="p-3 bg-gray-50">
                <div class="flex items-center justify-between mb-3">
                    <span class="text-xs font-medium text-gray-600">Filtros:</span>
                    <div class="text-xs text-gray-500">
                        <span id="total-registros">Carregando...</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                    <div class="space-y-1">
                        <label class="text-xs font-medium text-gray-600">Empresa</label>
                        <div id="empresa-filter-container" class="relative"></div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-medium text-gray-600">Categoria</label>
                        <div id="categoria-filter-container" class="relative"></div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-medium text-gray-600">Status</label>
                        <div id="status-filter-container" class="relative"></div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-medium text-gray-600">Período</label>
                        <div class="flex space-x-2">
                            <input type="date" id="data-inicio-filter" class="flex-1 text-xs border border-gray-300 rounded-md p-2" value="2025-01-01">
                            <input type="date" id="data-fim-filter" class="flex-1 text-xs border border-gray-300 rounded-md p-2" value="2025-12-31">
                        </div>
                    </div>
                </div>
                
                <!-- Filtros Ativos -->
                <div id="active-filters-container" class="mt-3 flex flex-wrap items-center gap-2 min-h-[1.5rem]"></div>
            </div>
        </div>

        <!-- Tabela Detalhada -->
        <div class="bg-white rounded-xl shadow-sm border">
            <div class="p-4 border-b border-gray-100 bg-primary-light">
                <div class="flex items-center justify-between">
                    <h3 class="font-semibold text-base text-primary">Análise por Categoria</h3>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2 text-xs">
                            <div class="w-3 h-3 bg-green-500 rounded"></div>
                            <span>Receitas</span>
                        </div>
                        <div class="flex items-center gap-2 text-xs">
                            <div class="w-3 h-3 bg-red-500 rounded"></div>
                            <span>Despesas</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="overflow-auto max-h-[600px]">
                <table class="w-full text-xs">
                    <thead class="text-gray-500 bg-gray-50 sticky top-0 z-10">
                        <tr>
                            <th class="p-2 text-left font-medium w-8"></th>
                            <th class="p-2 text-left font-medium min-w-[300px]">Categoria</th>
                            <th class="p-2 text-right font-medium">Jan</th>
                            <th class="p-2 text-right font-medium">Fev</th>
                            <th class="p-2 text-right font-medium">Mar</th>
                            <th class="p-2 text-right font-medium">Abr</th>
                            <th class="p-2 text-right font-medium">Mai</th>
                            <th class="p-2 text-right font-medium">Jun</th>
                            <th class="p-2 text-right font-medium">Jul</th>
                            <th class="p-2 text-right font-medium">Ago</th>
                            <th class="p-2 text-right font-medium">Set</th>
                            <th class="p-2 text-right font-medium">Out</th>
                            <th class="p-2 text-right font-medium">Nov</th>
                            <th class="p-2 text-right font-medium">Dez</th>
                            <th class="p-2 text-right font-medium">Total</th>
                            <th class="p-2 text-right font-medium">%</th>
                        </tr>
                    </thead>
                    <tbody id="dre-table-body" class="divide-y divide-gray-200">
                        <!-- Dados serão renderizados via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script src="assets/js/app.js"></script>
<script src="assets/js/fluxo_detalhado.js"></script>

</body>
</html>
