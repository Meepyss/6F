<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Fluxo de Caixa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="text-gray-700">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a class="text-xl font-bold text-gray-800" href="./index.html">Painel Financeiro</a>
                </div>
                <div class="flex space-x-4">
                    <a href="./index.html" class="text-gray-600 hover:text-blue-500">Início</a>
                    <a href="./contas_a_receber_dashboard.html" class="text-gray-600 hover:text-blue-500">Contas a Receber</a>
                    <a href="./contas_a_pagar_dashboard.html" class="text-gray-600 hover:text-blue-500">Contas a Pagar</a>
                    <a href="./fluxo_de_caixa_dashboard.html" class="text-gray-600 hover:text-blue-500 font-semibold text-blue-600">Fluxo de Caixa</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-3 md:p-4 lg:p-6">
        <!-- Cabeçalho com Filtros Integrados -->
        <div class="bg-white rounded-xl shadow-sm border mb-4">
            <div class="p-4 border-b border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Fluxo de Caixa</h1>
                        <p class="text-sm text-gray-500">Visão geral do fluxo de caixa para o período selecionado</p>
                    </div>
                    <button id="clear-filters-btn" class="bg-red-500 hover:bg-red-600 text-white text-sm font-medium py-2 px-3 rounded-lg transition-colors">
                        Limpar Filtros
                    </button>
                </div>
            </div>
            
            <!-- Filtros Compactos -->
            <div class="p-4 bg-gray-50">
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <div class="space-y-1">
                        <label class="text-xs font-medium text-gray-600">Empresa</label>
                        <div id="empresa-filter-container" class="relative"></div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-medium text-gray-600">Mov. Internas</label>
                        <div class="flex items-center h-8">
                            <div class="relative inline-block w-8 mr-2 align-middle select-none">
                                <input type="checkbox" name="internal-toggle" id="internal-toggle" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-2 appearance-none cursor-pointer"/>
                                <label for="internal-toggle" class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300 cursor-pointer">
                                    <span class="toggle-ball absolute inset-y-0 left-0 w-5 h-5 bg-white rounded-full shadow-sm transform transition-transform duration-200 ease-in-out"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-medium text-gray-600">Período</label>
                        <div id="projection-period-filter" class="flex items-center bg-white rounded-lg border p-1">
                            <button data-period="daily" class="filter-btn px-2 py-1 text-xs rounded">Diário</button>
                            <button data-period="weekly" class="filter-btn active px-2 py-1 text-xs rounded">Semanal</button>
                            <button data-period="monthly" class="filter-btn px-2 py-1 text-xs rounded">Mensal</button>
                        </div>
                    </div>
                </div>
                
                <!-- Filtros Ativos -->
                <div id="active-filters-container" class="mt-3 flex flex-wrap items-center gap-2 min-h-[1.5rem]"></div>
            </div>
        </div>

        <!-- KPIs e Alertas Compactos -->
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-3 mb-4">
            <!-- KPIs -->
            <div class="lg:col-span-3 grid grid-cols-1 md:grid-cols-3 gap-3" id="kpi-container">
                <!-- KPIs serão injetados aqui -->
            </div>
            <!-- Alertas -->
            <div class="bg-white rounded-lg shadow-sm border p-3" id="alerts-container">
                 <h3 class="font-semibold text-base text-gray-800 mb-2">Alertas</h3>
                 <!-- Alertas serão injetados aqui -->
            </div>
        </div>

        <!-- Layout de Gráficos Otimizado -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-4">
            <!-- Gráfico de Projeção de Saldo -->
            <div class="chart-card">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-semibold text-base text-gray-800">Projeção de Saldo</h3>
                    <span class="text-xs text-gray-500">Evolução do caixa</span>
                </div>
                <div class="h-[320px]">
                    <canvas id="projected-balance-chart"></canvas>
                </div>
            </div>
            
            <!-- Gráfico de Fluxo Previsto vs Realizado -->
            <div class="chart-card">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-semibold text-base text-gray-800">Previsto vs Realizado</h3>
                </div>
                <div class="h-[320px]">
                    <canvas id="cashflow-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- Calendário Financeiro Compacto -->
        <div class="bg-white rounded-xl shadow-sm border">
            <div class="p-4 border-b border-gray-100">
                <h3 class="font-semibold text-base text-gray-800">Calendário Financeiro</h3>
            </div>
            <div class="overflow-auto max-h-[400px]">
                <table class="w-full text-xs">
                    <thead class="text-gray-500 bg-gray-50 sticky top-0 z-10">
                        <tr>
                            <th class="p-2 text-left font-medium">Data</th>
                            <th class="p-2 text-right font-medium">A Receber</th>
                            <th class="p-2 text-right font-medium">A Pagar</th>
                            <th class="p-2 text-right font-medium">Saldo Dia</th>
                            <th class="p-2 text-right font-medium">Acumulado</th>
                        </tr>
                    </thead>
                    <tbody id="financial-calendar-body">
                        <!-- Tabela será injetada aqui -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script src="assets/js/app.js"></script>
<script src="./assets/js/fluxo_de_caixa.js"></script>

</body>
</html>
